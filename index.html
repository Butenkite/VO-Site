  <header class="top">
    <a class="home-mark" href="#top" data-name></a>
    <nav aria-label="Sections">
      <ul class="nav">
        <li><a class="scrap" href="#listen">listen</a></li>
        <li><a class="scrap" href="#roles">roles</a></li>
        <li><a class="scrap" href="#about">about</a></li>
        <li><a class="scrap" href="#contact">contact</a></li>
      </ul>
    </nav>
  </header>

  <main id="top">
    <section class="hero" aria-labelledby="hero-name">
      <div class="hero-text">
        <div class="name-strip">
          <h1 id="hero-name" class="torn" data-name></h1>
        </div>
        <p class="tagline" data-tagline></p>
        <ul class="voice-tags" data-voice></ul>
        <div class="hero-actions">
          <button class="scrap scrap--blue" type="button" data-play-latest>play a clip</button>
          <a class="scrap" href="#contact">get in touch</a>
        </div>
      </div>

      <figure class="photo" data-photo-wrap hidden>
        <div class="photo-paper torn">
          <img data-photo alt="" width="400" height="500">
          <figcaption data-photo-caption></figcaption>
        </div>
      </figure>
    </section>

    <section id="listen" class="sheet sheet--ruled torn" aria-labelledby="listen-h">
      <h2 id="listen-h" class="hand-h">listen</h2>
      <div data-reels></div>
      <h3 class="hand-sub" data-samples-h>clips</h3>
      <ol class="tracks" data-samples></ol>
    </section>

    <section id="roles" aria-labelledby="roles-h">
      <h2 id="roles-h" class="hand-h">roles</h2>
      <ul class="tags" data-roles></ul>
    </section>

    <div class="pair">
      <section id="about" class="sheet sheet--typed torn" aria-labelledby="about-h">
        <h2 id="about-h" class="hand-h">about</h2>
        <div class="about-body" data-about></div>
      </section>

      <section class="card torn" aria-labelledby="studio-h" data-studio-wrap>
        <h2 id="studio-h" class="hand-h hand-h--small">the booth</h2>
        <ul class="studio" data-studio></ul>
      </section>
    </div>

    <section id="contact" class="contact" aria-labelledby="contact-h">
      <h2 id="contact-h" class="hand-h">contact</h2>
      <p class="contact-lead">Auditions, bookings, or just a hello:</p>
      <a class="scrap scrap--big" data-email></a>
      <p class="agent" data-agent></p>
      <ul class="links" data-links></ul>
    </section>
  </main>

  <footer class="foot">
    <p>© <span data-year></span> <span data-name></span></p>
  </footer>
